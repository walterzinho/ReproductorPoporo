<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Radio Textos Grandes - Voces Campesinas</title>

    <!-- Librerías -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --carbon: #17202A;
            --trigo: #F4D03F;
        }
        body {
            background: transparent;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .glass-player {
            position: relative;
            background-color: var(--carbon);
            background-size: cover;
            background-position: center;
            border-radius: 0.5rem;
            overflow: hidden;
            transition: background-image 0.7s ease-in-out;
        }
        /* Capa de gradiente optimizada para legibilidad con textos más grandes */
        .glass-player::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(80deg, rgba(10, 14, 19, 0.70) 35%, rgba(10, 14, 19, 0.4) 100%);
            z-index: 1;
        }
        .player-content {
            position: relative;
            z-index: 2;
        }
        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--trigo);
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
        }
        @keyframes pulse-live {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .animate-pulse-live { animation: pulse-live 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ─────────────────────────────────────────────────────────
        // CONFIGURACIÓN (inyectada por el panel; editable a mano)
        // La programación vive en GitHub: {repo}/{branch}/{schedulePath}
        // ─────────────────────────────────────────────────────────
        const WIDGET_CONFIG = {
  "name": "Voces Campesinas",
  "streamUrl": "https://emisora.vocescampesinas.co/listen/vocescampesinas/radio.mp3",
  "defaultBg": "https://raw.githubusercontent.com/walterzinho/ReproductorPoporo/main/imagenes/general-musica.jpg",
  "repo": "walterzinho/ReproductorPoporo",
  "branch": "main",
  "schedulePath": "programacion.json"
};

        // Programación de respaldo: se usa solo si GitHub aún no
        // tiene el archivo o no responde. No es necesario tocarla:
        // administra todo desde el panel y se guarda en GitHub.
        const PROGRAMAS_RESPALDO = [
            { id: "prog-01", titulo: "Cosecha de Fin de Año", conductor: "Joaquin Escobar", inicio: "18:30", fin: "20:30", dias: [1,2,3,4,5,6], imagen: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=600" },
            { id: "prog-02", titulo: "Alborada Colombiana", conductor: "Música Colombiana", inicio: "05:00", fin: "06:29", dias: [0,1,2,3,4,5,6], imagen: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=600" },
            { id: "prog-03", titulo: "Campesinos en Acción", conductor: "ANUC La Palma", inicio: "06:30", fin: "06:59", dias: [6,1], imagen: "https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?q=80&w=600" },
            { id: "prog-04", titulo: "Perreo Campesino", conductor: "Música Carranguera", inicio: "07:00", fin: "07:59", dias: [1,2,4,5,0], imagen: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=600" },
            { id: "prog-05", titulo: "Magazín Región Activa", conductor: "Jotta Ricón", inicio: "07:30", fin: "10:59", dias: [6,3], imagen: "https://images.unsplash.com/photo-1478737270239-2fccd2c78621?q=80&w=600" },
            { id: "prog-06", titulo: "Reemisión Magazín Región Activa", conductor: "Jotta Rincón", inicio: "22:00", fin: "23:59", dias: [4], imagen: "https://images.unsplash.com/photo-1520520131472-3093f5044aa7?q=80&w=600", esReemision: true, origenId: "prog-05" },
            { id: "prog-07", titulo: "La Parcela de Opinión", conductor: "Walter Sosa", inicio: "21:00", fin: "21:30", dias: [4,5], imagen: "https://raw.githubusercontent.com/walterzinho/VocesApp/main/parcela-politica.jpg" },
            { id: "prog-08", titulo: "Perreo Campesino", conductor: "Música Carranguera", inicio: "13:00", fin: "13:59", dias: [0,1,2,3,4,5,6], imagen: "https://images.unsplash.com/photo-1459749411177-042180ce673c?q=80&w=600" },
            { id: "prog-09", titulo: "Palabras del Territorio", conductor: "Walter Sosa", inicio: "19:30", fin: "20:29", dias: [2,6], imagen: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?q=80&w=600" },
            { id: "prog-10", titulo: "Renacer Andino", conductor: "Ramón Olivares", inicio: "19:30", fin: "20:30", dias: [0,3], imagen: "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?q=80&w=600" },
            { id: "prog-11", titulo: "Renacer Andino", conductor: "Ramón Olivares", inicio: "20:30", fin: "21:30", dias: [3], imagen: "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?q=80&w=600", esReemision: true, origenId: "prog-10" },
            { id: "prog-12", titulo: "Lo Mejor de Región Activa", conductor: "Jotta Rincón", inicio: "19:30", fin: "22:59", dias: [5], imagen: "https://images.unsplash.com/photo-1520520131472-3093f5044aa7?q=80&w=600" },
            { id: "prog-13", titulo: "Cosecha de Amor", conductor: "Dj Rosado", inicio: "20:00", fin: "20:59", dias: [1,2,3,4,6,0], imagen: "https://images.unsplash.com/photo-1516280440614-37939bbacd81?q=80&w=600" },
            { id: "prog-14", titulo: "Cuentos y Leyendas", conductor: "Abuelo Ricardo", inicio: "21:30", fin: "23:59", dias: [2,3,4,5], imagen: "https://images.unsplash.com/photo-1532012197267-da84d127e765?q=80&w=600" },
            { id: "prog-15", titulo: "Flash Informativo", conductor: "Redacción Voces Campesinas", inicio: "09:00", fin: "09:05", dias: [0,1,2,3,4,5,6], repetirCada: 2, imagen: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?q=80&w=600" },
            { id: "prog-16", titulo: "Flash Informativo", conductor: "Redacción Voces Campesinas", inicio: "10:00", fin: "10:05", dias: [0,1,2,3,4,5,6], repetirCada: 2, imagen: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?q=80&w=600" }
        ];

        const timeToMin = (t) => {
            const [h, m] = (t || "0:0").split(":").map(Number);
            return (h || 0) * 60 + (m || 0);
        };

        /**
         * Ventanas concretas (minutos desde las 00:00) que genera una franja.
         * - Sin repetirCada: una sola ventana; si fin <= inicio cruza la medianoche.
         * - Con repetirCada N: la franja se repite cada N horas dentro del mismo
         *   día; cada repetición dura fin − inicio y debe terminar antes de las 24:00.
         * Ej.: inicio 09:00, fin 09:05, repetirCada 2 → 09:00, 11:00, 13:00… (impares).
         */
        function ventanasDeHorario(h) {
            const s = timeToMin(h.inicio);
            const e = timeToMin(h.fin);
            const dur = e > s ? e - s : 1440 - s + e;
            const rep = Number(h.repetirCada);
            if (Number.isInteger(rep) && rep >= 1) {
                const wins = [];
                for (let d = s; d + dur <= 1440; d += rep * 60) wins.push([d, d + dur]);
                return wins.length ? wins : [[s, s + dur]];
            }
            return [[s, s + dur]];
        }

        /** Franjas efectivas del programa: la principal (inicio/fin/dias) + las adicionales (horarios[]). */
        function franjasDePrograma(p) {
            const base = { inicio: p.inicio, fin: p.fin, dias: p.dias, repetirCada: p.repetirCada };
            const extras = Array.isArray(p.horarios) ? p.horarios : [];
            return [base].concat(extras).filter(h => h && h.inicio && h.fin);
        }

        /**
         * Ocurrencias absolutas de todos los programas en los próximos días.
         * Cada ocurrencia es { prog, inicio, fin } (Date); respeta franjas
         * múltiples (horarios[]), la repetición cada N horas (repetirCada) y
         * el cruce de medianoche, con la MISMA semántica de ventanasDeHorario.
         */
        function ocurrenciasDe(programas, diasAdelante, base) {
            const out = [];
            const b = base ? new Date(base) : new Date();
            b.setHours(0, 0, 0, 0);
            for (const p of programas) {
                for (const h of franjasDePrograma(p)) {
                    const dias = (Array.isArray(h.dias) && h.dias.length) ? h.dias : (p.dias || []);
                    for (const [desde, hasta] of ventanasDeHorario(h)) {
                        // Desde el día anterior (d = −1): un programa que cruzó
                        // la medianoche sigue al aire esta madrugada.
                        for (let d = -1; d <= diasAdelante; d++) {
                            if (!dias.includes(((b.getDay() + d) % 7 + 7) % 7)) continue;
                            const inicio = new Date(b.getTime() + (d * 1440 + desde) * 60000);
                            const fin = new Date(inicio.getTime() + (hasta - desde) * 60000);
                            out.push({ prog: p, inicio, fin });
                        }
                    }
                }
            }
            return out.sort((a, c) => a.inicio - c.inicio);
        }

        /**
         * Estado de la emisora: qué suena ahora y qué programa sigue.
         * - actual: ocurrencia que contiene `ahora`; si dos se cruzan, gana
         *   la que empezó más reciente (misma regla de siempre).
         * - siguiente: primera ocurrencia que arranca cuando termina la
         *   actual (o después de `ahora` si nada está al aire).
         */
        function estadoReproduccion(programas, diasAdelante, ahora) {
            const t = (ahora == null) ? new Date() : new Date(ahora);
            const oc = ocurrenciasDe(programas, diasAdelante == null ? 8 : diasAdelante, t);
            let actual = null;
            for (const o of oc) {
                if (o.inicio <= t && t < o.fin && (!actual || o.inicio > actual.inicio)) actual = o;
            }
            const limite = actual ? actual.fin : t;
            const siguiente = oc.find(o => o.inicio >= limite) || null;
            return { actual: actual ? actual.prog : null, siguiente };
        }

        /** Etiqueta del próximo inicio: "Hoy 14:00", "Mañana 05:00", "Sáb 18:30". */
        function etiquetaCuando(inicio, ahora) {
            if (!inicio) return "";
            const DIAS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
            const t = (ahora == null) ? new Date() : new Date(ahora);
            const f = (d) => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
            const mismoDia = (a, b2) => a.getFullYear() === b2.getFullYear() && a.getMonth() === b2.getMonth() && a.getDate() === b2.getDate();
            const manana = new Date(t.getTime() + 86400000);
            if (mismoDia(inicio, t)) return "Hoy " + f(inicio);
            if (mismoDia(inicio, manana)) return "Mañana " + f(inicio);
            return DIAS[inicio.getDay()] + " " + f(inicio);
        }

        /**
         * Información efectiva del programa en pantalla.
         * - Episodio original: sus propios datos.
         * - Reemisión: título, conductor e imagen del programa original
         *   (por origenId); si el original ya no existe, usa los datos
         *   guardados en la propia reemisión.
         */
        function resolverProg(p, programas) {
            if (!p) return { titulo: "", conductor: "", imagen: "", esReemision: false };
            let origen = null;
            if (p.esReemision && p.origenId) {
                origen = programas.find(x => x.id === p.origenId && x.id !== p.id) || null;
            }
            return {
                titulo: (origen && origen.titulo) || p.titulo || "",
                conductor: (origen && origen.conductor) || p.conductor || "",
                imagen: (origen && origen.imagen) || p.imagen || "",
                esReemision: Boolean(p.esReemision)
            };
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                'play': <polygon points="5 3 19 12 5 21 5 3"></polygon>,
                'pause': <g><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></g>,
                'volume': <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></g>,
                'replay': <g><path d="m3 12 9-9 9 9"></path><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"></path></g>,
                'next': <g><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></g>
            };
            return (
                <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [volume, setVolume] = useState(0.8);
            const [remote, setRemote] = useState(null);
            const [currentProg, setCurrentProg] = useState(null);
            const [nextInfo, setNextInfo] = useState(null);
            const audioRef = useRef(null);

            // 1) Sincroniza la programación desde GitHub cada 2 minutos
            useEffect(() => {
                let alive = true;
                const load = () => {
                    if (!WIDGET_CONFIG.repo) return;
                    const url = "https://raw.githubusercontent.com/" + WIDGET_CONFIG.repo + "/" + WIDGET_CONFIG.branch + "/" + WIDGET_CONFIG.schedulePath + "?t=" + Date.now();
                    fetch(url, { cache: "no-store" })
                        .then(r => r.ok ? r.json() : Promise.reject(new Error("sin datos")))
                        .then(json => {
                            if (alive && json && Array.isArray(json.programas) && json.programas.length) {
                                setRemote(json);
                            }
                        })
                        .catch(() => {});
                };
                load();
                const timer = setInterval(load, 120000);
                return () => { alive = false; clearInterval(timer); };
            }, []);

            const programas = (remote && Array.isArray(remote.programas) && remote.programas.length)
                ? remote.programas
                : PROGRAMAS_RESPALDO;
            const streamUrl = (remote && remote.emisora && remote.emisora.streamUrl) || WIDGET_CONFIG.streamUrl;
            const defaultBg = (remote && remote.emisora && remote.emisora.imagenPorDefecto) || WIDGET_CONFIG.defaultBg;

            // 2) ¿Qué suena ahora y qué sigue? (reevalúa cada 30 s)
            useEffect(() => {
                const checkSchedule = () => {
                    const estado = estadoReproduccion(programas);
                    setCurrentProg(estado.actual || {
                        titulo: "Música de la Tierrita",
                        conductor: WIDGET_CONFIG.name,
                        imagen: defaultBg
                    });
                    setNextInfo(estado.siguiente);
                };
                checkSchedule();
                const timer = setInterval(checkSchedule, 30000);
                return () => clearInterval(timer);
            }, [programas, defaultBg]);

            // Información resuelta (reemisiones toman los datos del original)
            const vista = resolverProg(currentProg, programas);
            const sigVista = nextInfo ? resolverProg(nextInfo.prog, programas) : null;

            const togglePlay = () => {
                const audio = audioRef.current;
                if (!isPlaying) {
                    audio.src = streamUrl;
                    audio.play().catch(() => setIsPlaying(false));
                } else {
                    audio.pause();
                }
                setIsPlaying(!isPlaying);
            };

            return (
                <div className="p-1 w-full">
                    <audio ref={audioRef} onError={() => setIsPlaying(false)} />

                    <div
                        className="glass-player shadow-xl transition-all duration-700"
                        style={{ backgroundImage: `url(${vista.imagen || defaultBg})` }}
                    >
                        <div className="player-content">
                        <div className="grid grid-cols-12 items-center">

                            {/* BOTÓN */}
                            <div className="col-span-3 flex items-center justify-center p-4">
                                <button
                                    onClick={togglePlay}
                                    className="w-14 h-14 bg-[#F4D03F] text-black rounded-lg flex items-center justify-center shadow-lg active:scale-90 transition-all"
                                >
                                    {isPlaying ? <Icon name="pause" size={28} /> : <Icon name="play" size={28} />}
                                </button>
                            </div>

                            {/* INFO Y VOLUMEN (TEXTOS +2 PUNTOS) */}
                            <div className="col-span-9 p-4 flex flex-col justify-center">
                                <div className="mb-3">
                                    <div className="flex flex-wrap items-center gap-2 mb-1">
                                        <span className="flex h-2 w-2 rounded-full bg-red-500 animate-pulse-live"></span>
                                        {/* Aumentado de 8px a 10px */}
                                        <span className="text-[14px] font-black tracking-[0.2em] text-white/60">Al Aire</span>
                                        {vista.esReemision ? (
                                            <span className="inline-flex items-center gap-1 rounded-full bg-[#F4D03F] px-2 py-0.5 text-[9px] font-black tracking-[0.15em] text-black">
                                                <Icon name="replay" size={10} className="text-black" /> REEMISIÓN
                                            </span>
                                        ) : (
                                            <span className="inline-flex items-center rounded-full border border-white/30 px-2 py-0.5 text-[9px] font-black tracking-[0.15em] text-white/70">
                                                ORIGINAL
                                            </span>
                                        )}
                                    </div>
                                    {/* Aumentado de text-sm (16px) a text-base (18px) */}
                                    <h2 className="text-[22px] font-black truncate text-white/90 leading-tight mb-1 drop-shadow-md">
                                        {vista.titulo}
                                    </h2>
                                    {/* Aumentado de 12px a 14px (text-xs) */}
                                    <p className="text-[12px] text-[#F4D03F] italic truncate drop-shadow-sm font-medium">
                                        de {vista.conductor}
                                    </p>
                                </div>

                                <div className="flex items-center gap-3">
                                    <Icon name="volume" size={14} className="text-white/40" />
                                    <div className="flex-1 flex items-center gap-3">
                                        <input
                                            type="range" min="0" max="1" step="0.01"
                                            value={volume}
                                            onChange={(e) => {
                                                const v = parseFloat(e.target.value);
                                                setVolume(v);
                                                audioRef.current.volume = v;
                                            }}
                                            className="flex-1 h-1.5 bg-white/50 rounded-full appearance-none volume-slider cursor-pointer"
                                        />
                                        {/* Aumentado de 10px a 12px */}
                                        <span className="text-[10px] font-black text-white/40 w-6 text-right uppercase">
                                            {Math.round(volume * 100)}
                                        </span>
                                    </div>
                                </div>
                            </div>

                        </div>

                        {/* FRANJA "A CONTINUACIÓN" — próximo programa, dentro del reproductor */}
                        {sigVista && nextInfo && (
                            <div className="border-t border-white/10 bg-black/40 px-4 py-2.5">
                                <div className="flex flex-wrap items-center gap-2">
                                    <span className="inline-flex items-center gap-1.5 text-[10px] font-black tracking-[0.18em] text-[#F4D03F]">
                                        <Icon name="next" size={12} className="text-[#F4D03F]" /> A CONTINUACIÓN
                                    </span>
                                    <span className="inline-flex items-center rounded-full border border-white/25 bg-white/10 px-2 py-0.5 text-[9px] font-black tracking-[0.12em] text-white/80 uppercase">
                                        {etiquetaCuando(nextInfo.inicio)}
                                    </span>
                                    {sigVista.esReemision && (
                                        <span className="inline-flex items-center gap-1 rounded-full bg-[#F4D03F] px-2 py-0.5 text-[9px] font-black tracking-[0.15em] text-black">
                                            <Icon name="replay" size={10} className="text-black" /> REEMISIÓN
                                        </span>
                                    )}
                                </div>
                                <div className="mt-1 flex items-baseline gap-2 min-w-0">
                                    <h3 className="text-[16px] font-black text-white/90 truncate leading-tight drop-shadow-md">
                                        {sigVista.titulo}
                                    </h3>
                                    <span className="text-[11px] text-white/55 truncate font-medium">
                                        con {sigVista.conductor}
                                    </span>
                                </div>
                            </div>
                        )}

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
