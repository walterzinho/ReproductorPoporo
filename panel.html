<script type="text/babel" data-presets="env,jsx-classic">
const { useState, useEffect, useMemo, useRef } = React;

/* ══════════════ CONFIGURACIÓN (editable en Ajustes; se guarda en este navegador) ══════════════ */
const CFG_DEF = {
  owner: "walterzinho",
  repo: "ReproductorPoporo",
  branch: "main",
  schedulePath: "programacion.json",
  imagesFolder: "imagenes",
};
const K_CFG = "voces-cfg", K_TOKEN = "voces-token", K_THEME = "voces-theme";
function cargarCfg() {
  try { return Object.assign({}, CFG_DEF, JSON.parse(localStorage.getItem(K_CFG) || "{}")); }
  catch { return Object.assign({}, CFG_DEF); }
}
const urlRaw = (c) => `https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch}`;
/** El widget se sirve desde GitHub Pages (jsDelivr y raw sirven .html como text/plain). */
const urlWidget = (c) => `https://${c.owner}.github.io/${c.repo}/widget.html`;
const urlPagina = (c) => `https://${c.owner}.github.io/${c.repo}/panel.html`;

const DIAS_SEMANA = [
  { valor: 1, corta: "Lun" }, { valor: 2, corta: "Mar" }, { valor: 3, corta: "Mié" },
  { valor: 4, corta: "Jue" }, { valor: 5, corta: "Vie" }, { valor: 6, corta: "Sáb" },
  { valor: 0, corta: "Dom" },
];
const nombreDias = (dias) => {
  const d = [...(dias || [])].sort((a, b) => (a === 0 ? 7 : a) - (b === 0 ? 7 : b));
  if (d.length === 7) return "Todos los días";
  if (d.length === 5 && [1,2,3,4,5].every((x) => d.includes(x))) return "Lun a Vie";
  if (d.length === 2 && d.includes(0) && d.includes(6)) return "Fines de semana";
  return d.map((v) => (DIAS_SEMANA.find((x) => x.valor === v) || {}).corta || v).join(", ") || "Sin días";
};

/* ══════════════ LÓGICA DE HORARIOS (idéntica al widget) ══════════════ */
function aMinutos(t) {
  const [h, m] = String(t || "0:0").split(":").map((n) => parseInt(n, 10) || 0);
  return h * 60 + m;
}
function duracionMin(h) {
  const s = aMinutos(h.inicio), e = aMinutos(h.fin);
  return e > s ? e - s : 1440 - s + e;
}
function ventanasDeHorario(h) {
  const s = aMinutos(h.inicio), dur = duracionMin(h);
  const rep = Number(h.repetirCada);
  if (Number.isInteger(rep) && rep >= 1) {
    const v = [];
    for (let d = s; d + dur <= 1440; d += rep * 60) v.push({ desde: d, hasta: d + dur });
    return v.length ? v : [{ desde: s, hasta: Math.min(1440, s + dur) }];
  }
  return [{ desde: s, hasta: Math.min(1440, s + dur) }];
}
function horasDeRepeticion(h, max) {
  const rep = Number(h.repetirCada);
  if (!Number.isInteger(rep) || rep < 1) return [];
  const s = aMinutos(h.inicio), dur = duracionMin(h), horas = [];
  for (let d = s; d + dur <= 1440; d += rep * 60) {
    horas.push(String(Math.floor(d / 60)).padStart(2, "0") + ":" + String(d % 60).padStart(2, "0"));
    if (horas.length >= (max || 12)) break;
  }
  return horas;
}
function inicioEfectivoSiAlAire(p, ahora) {
  const cur = ahora.getHours() * 60 + ahora.getMinutes();
  const dia = ahora.getDay();
  let mejor = null;
  for (const h of [{ inicio: p.inicio, fin: p.fin, dias: p.dias, repetirCada: p.repetirCada }]) {
    for (const v of ventanasDeHorario(h)) {
      const dias = h.dias || [];
      const alAire = cur >= v.desde && cur < v.hasta && dias.includes(dia);
      if (alAire && (mejor === null || v.desde > mejor)) mejor = v.desde;
    }
  }
  return mejor;
}
function encontrarAlAire(programas, ahora) {
  let mejor = null, mejorInicio = -Infinity;
  for (const p of programas) {
    const i = inicioEfectivoSiAlAire(p, ahora);
    if (i !== null && i > mejorInicio) { mejor = p; mejorInicio = i; }
  }
  return mejor;
}
function sanitizarPrograma(p) {
  const id = String(p?.id || "");
  const out = {
    id,
    titulo: String(p?.titulo || "").trim(),
    conductor: String(p?.conductor || "").trim(),
    inicio: String(p?.inicio || "00:00"),
    fin: String(p?.fin || "00:00"),
    dias: Array.isArray(p?.dias) ? p.dias.map(Number).filter((n) => Number.isInteger(n) && n >= 0 && n <= 6) : [],
    imagen: String(p?.imagen || "").trim(),
    esReemision: Boolean(p?.esReemision),
  };
  const rep = Number(p?.repetirCada);
  if (Number.isInteger(rep) && rep >= 1 && rep <= 12) out.repetirCada = rep;
  return out;
}

/* ══════════════ API GITHUB (desde el navegador, con tu token) ══════════════ */
let TOKEN = "";
function api(cfg, path, opts) {
  opts = opts || {};
  const headers = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  if (TOKEN) headers.Authorization = "Bearer " + TOKEN;
  if (opts.body) headers["Content-Type"] = "application/json";
  return fetch("https://api.github.com" + path, Object.assign({}, opts, { headers }));
}
const aBase64 = (s) => btoa(unescape(encodeURIComponent(s)));
const deBase64 = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0)));

function mensajeError(status, j) {
  const det = j && j.message ? ` (${j.message})` : "";
  if (status === 401) return "Token inválido o expirado. Genera otro en github.com/settings/tokens";
  if (status === 403) return "GitHub rechazó la operación (sin permisos o límite de peticiones)" + det;
  if (status === 404) return "No se encontró el repositorio o el archivo" + det;
  if (status === 409 || status === 422) return "Conflicto de versiones: el archivo cambió en GitHub. Pulsa «Recargar» e intenta de nuevo." + det;
  return "Error de GitHub " + status + det;
}

/** Lee la programación. Con token usa la API (devuelve sha para guardar);
 *  sin token lee de jsDelivr (solo lectura). */
async function leerProgramacion(cfg) {
  if (TOKEN) {
    const r = await api(cfg, `/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.schedulePath}?ref=${encodeURIComponent(cfg.branch)}`);
    if (r.status === 404) return { sha: null, data: null, soloLectura: false };
    if (!r.ok) throw new Error(mensajeError(r.status, await r.json().catch(() => ({}))));
    const j = await r.json();
    const data = JSON.parse(deBase64(j.content));
    if (!data.emisora) data.emisora = null;
    if (!Array.isArray(data.programas)) data.programas = [];
    return { sha: j.sha, data, soloLectura: false };
  }
  const r = await fetch(`https://cdn.jsdelivr.net/gh/${cfg.owner}/${cfg.repo}@${cfg.branch}/${cfg.schedulePath}?t=${Date.now()}`);
  if (!r.ok) throw new Error("No se pudo leer la programación pública (" + r.status + ")");
  const data = await r.json();
  if (!data.emisora) data.emisora = null;
  if (!Array.isArray(data.programas)) data.programas = [];
  return { sha: null, data, soloLectura: true };
}
async function guardarProgramacion(cfg, data, sha) {
  const body = {
    message: `programación: ${data.programas.length} programa(s) — panel web`,
    content: aBase64(JSON.stringify(data, null, 2)),
    branch: cfg.branch,
  };
  if (sha) body.sha = sha;
  const r = await api(cfg, `/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.schedulePath}`, { method: "PUT", body: JSON.stringify(body) });
  if (!r.ok) throw new Error(mensajeError(r.status, await r.json().catch(() => ({}))));
  return (await r.json()).content.sha;
}
async function listarImagenes(cfg) {
  const r = await api(cfg, `/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.imagesFolder}?ref=${encodeURIComponent(cfg.branch)}`);
  if (r.status === 404) return [];
  if (!r.ok) throw new Error(mensajeError(r.status, await r.json().catch(() => ({}))));
  const arr = await r.json();
  if (!Array.isArray(arr)) return [];
  return arr.filter((i) => i.type === "file" && /\.(jpe?g|png|gif|webp|avif|svg)$/i.test(i.name))
    .map((i) => ({ name: i.name, url: `${urlRaw(cfg)}/${cfg.imagesFolder}/${i.name}`, sha: i.sha, size: i.size }));
}
async function subirImagen(cfg, nombre, base64) {
  const existentes = TOKEN ? await listarImagenes(cfg) : [];
  let final = nombre, n = 2;
  while (existentes.some((i) => i.name === final)) {
    const p = nombre.lastIndexOf(".");
    final = p > 0 ? `${nombre.slice(0, p)}-${n}${nombre.slice(p)}` : `${nombre}-${n}`;
    n++;
  }
  const r = await api(cfg, `/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.imagesFolder}/${final}`, {
    method: "PUT",
    body: JSON.stringify({ message: `imagen: ${final} — panel web`, content: base64, branch: cfg.branch }),
  });
  if (!r.ok) throw new Error(mensajeError(r.status, await r.json().catch(() => ({}))));
  return `${urlRaw(cfg)}/${cfg.imagesFolder}/${final}`;
}
async function borrarImagen(cfg, name, sha) {
  const r = await api(cfg, `/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.imagesFolder}/${name}`, {
    method: "DELETE",
    body: JSON.stringify({ message: `imagen eliminada: ${name} — panel web`, sha, branch: cfg.branch }),
  });
  if (!r.ok) throw new Error(mensajeError(r.status, await r.json().catch(() => ({}))));
}
async function archivoABase64Jpeg(file, maxPx, calidad) {
  const dataUrl = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file);
  });
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = rej; i.src = dataUrl;
  });
  const escala = Math.min(1, (maxPx || 1600) / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", calidad || 0.87).split(",")[1];
}
async function copiarTexto(texto) {
  try { await navigator.clipboard.writeText(texto); return true; }
  catch {
    try {
      const ta = document.createElement("textarea");
      ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta); return ok;
    } catch { return false; }
  }
}
/* ══════════════ ÁTOMOS DE UI ══════════════ */
function Badge({ tone, children }) {
  const estilos = tone === "reemision"
    ? "border-sky-400/60 text-sky-700 dark:border-sky-400/50 dark:text-sky-300"
    : tone === "aire"
      ? "border-transparent bg-emerald-500/15 text-emerald-700 dark:bg-emerald-400/15 dark:text-emerald-300"
      : "border-amber-500/60 text-amber-700 dark:border-amber-400/50 dark:text-amber-300";
  return <span className={"inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-[10px] font-bold tracking-wide " + estilos}>{children}</span>;
}
function Boton({ principal, peligro, fantasma, className, children, ...props }) {
  const base = "inline-flex items-center justify-center gap-1.5 rounded-lg px-3.5 py-2 text-sm font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed ";
  const estilo = principal
    ? "bg-[#F4D03F] text-[#1a1305] hover:brightness-105 shadow-sm"
    : peligro
      ? "border border-red-500/40 text-red-700 dark:text-red-300 hover:bg-red-500/10"
      : fantasma
        ? "hover:bg-black/5 dark:hover:bg-white/10"
        : "border border-zinc-300 bg-white text-zinc-800 hover:bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:hover:bg-zinc-800";
  return <button className={base + estilo + " " + (className || "")} {...props}>{children}</button>;
}
function Tarjeta({ className, children }) {
  return <div className={"rounded-xl border border-zinc-200 bg-white shadow-sm dark:border-zinc-800 dark:bg-zinc-900 " + (className || "")}>{children}</div>;
}
const inpCls = "w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm outline-none focus:border-[#F4D03F] dark:border-zinc-700 dark:bg-black/30 dark:text-zinc-100";
function Campo({ label, hint, children }) {
  return (
    <label className="block">
      <span className="mb-1 block text-xs font-semibold text-zinc-600 dark:text-zinc-400">{label}</span>
      {children}
      {hint && <span className="mt-1 block text-[11px] text-zinc-500 dark:text-zinc-500">{hint}</span>}
    </label>
  );
}
function ChipsDias({ dias, onChange }) {
  const toggle = (v) => onChange(dias.includes(v) ? dias.filter((d) => d !== v) : [...dias, v].sort((a, b) => (a === 0 ? 7 : a) - (b === 0 ? 7 : b)));
  return (
    <div className="flex flex-wrap gap-1">
      {DIAS_SEMANA.map((d) => (
        <button type="button" key={d.valor} onClick={() => toggle(d.valor)}
          className={"rounded-full border px-2.5 py-1 text-xs font-semibold transition " + (dias.includes(d.valor)
            ? "border-[#F4D03F] bg-[#F4D03F] text-[#1a1305]"
            : "border-zinc-300 text-zinc-600 hover:border-zinc-400 dark:border-zinc-700 dark:text-zinc-400 dark:hover:border-zinc-500")}>
          {d.corta}
        </button>
      ))}
      <button type="button" onClick={() => onChange([0,1,2,3,4,5,6])}
        className="rounded-full border border-dashed border-zinc-300 px-2.5 py-1 text-xs font-semibold text-zinc-500 hover:border-zinc-400 dark:border-zinc-700 dark:text-zinc-500">Todos</button>
    </div>
  );
}
function Dialogo({ titulo, onClose, children, ancho }) {
  useEffect(() => {
    const h = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/60 p-4 pt-10" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={"w-full rounded-xl border border-zinc-200 bg-white shadow-2xl dark:border-zinc-700 dark:bg-zinc-900 " + (ancho || "max-w-lg")}>
        <div className="flex items-center justify-between border-b border-zinc-200 px-4 py-3 dark:border-zinc-800">
          <h3 className="text-base font-bold">{titulo}</h3>
          <button onClick={onClose} className="rounded-md px-2 py-1 text-zinc-500 hover:bg-black/5 dark:hover:bg-white/10">✕</button>
        </div>
        <div className="p-4">{children}</div>
      </div>
    </div>
  );
}
function AvisoRepeticion({ inicio, fin, repetirCada }) {
  const horas = horasDeRepeticion({ inicio, fin, repetirCada }, 12);
  if (!horas.length) return null;
  const impares = horas.some((h) => Number(h.split(":")[0]) % 2 === 1);
  const pares = horas.some((h) => Number(h.split(":")[0]) % 2 === 0);
  const pista = impares && !pares ? " (horas impares)" : pares && !impares ? " (horas pares)" : "";
  return (
    <p className="rounded-lg bg-amber-500/10 px-3 py-2 text-[11px] leading-relaxed text-amber-800 dark:text-amber-200">
      ⏱ Sale a las: <b>{horas.join(", ")}</b>{pista} — cada emisión va de {inicio} a {fin}.
    </p>
  );
}

/* ══════════════ TARJETA DE PROGRAMA ══════════════ */
function ProgramaCard({ p, alAire, onEditar, onBorrar, onDuplicar }) {
  const dur = duracionMin(p);
  return (
    <Tarjeta className={"flex items-center gap-3 p-3 " + (alAire ? "ring-2 ring-emerald-400/60" : "")}>
      <img src={p.imagen || ""} alt="" className="h-14 w-24 shrink-0 rounded-lg border border-zinc-200 object-cover dark:border-zinc-800"
        onError={(e) => { e.target.style.visibility = "hidden"; }} />
      <div className="min-w-0 flex-1">
        <div className="flex flex-wrap items-center gap-1.5">
          <Badge tone={p.esReemision ? "reemision" : "original"}>{p.esReemision ? "REEMISIÓN" : "ORIGINAL"}</Badge>
          {alAire && <Badge tone="aire"><span className="pulso inline-block h-1.5 w-1.5 rounded-full bg-emerald-500 dark:bg-emerald-400" /> AL AIRE</Badge>}
          <h4 className="truncate text-sm font-bold">{p.titulo || "(sin título)"}</h4>
        </div>
        <p className="truncate text-xs text-zinc-500 dark:text-zinc-400">{p.conductor || "—"} · {nombreDias(p.dias)}</p>
        <p className="mt-0.5 font-mono text-xs font-semibold text-amber-700 dark:text-[#F4D03F]">
          {p.inicio} – {p.fin}{p.repetirCada ? `  ·  repite cada ${p.repetirCada} h` : ""}  ·  {Math.floor(dur / 60) ? Math.floor(dur / 60) + " h " : ""}{dur % 60 ? (dur % 60) + " min" : Math.floor(dur / 60) ? "" : dur + " min"}
        </p>
      </div>
      <div className="flex shrink-0 flex-col gap-1 sm:flex-row">
        <Boton fantasma className="!px-2 !py-1 text-xs" onClick={onEditar} title="Editar">✏️ Editar</Boton>
        <Boton fantasma className="!px-2 !py-1 text-xs" onClick={onDuplicar} title="Duplicar">⧉</Boton>
        <Boton peligro className="!px-2 !py-1 text-xs" onClick={onBorrar} title="Eliminar">🗑</Boton>
      </div>
    </Tarjeta>
  );
}

/* ══════════════ EDITOR DE PROGRAMA ══════════════ */
function EditorPrograma({ inicial, cfg, conToken, onGuardar, onCerrar, aviso }) {
  const [p, setP] = useState(() => ({
    id: inicial.id || "prog-" + Date.now().toString(36),
    titulo: inicial.titulo || "",
    conductor: inicial.conductor || "",
    inicio: inicial.inicio || "08:00",
    fin: inicial.fin || "09:00",
    dias: Array.isArray(inicial.dias) ? inicial.dias : [1, 2, 3, 4, 5],
    imagen: inicial.imagen || "",
    esReemision: Boolean(inicial.esReemision),
    repetirCada: inicial.repetirCada || undefined,
  }));
  const [subiendo, setSubiendo] = useState(false);
  const fileRef = useRef(null);
  const set = (k, v) => setP((x) => Object.assign({}, x, { [k]: v }));

  async function subir(file) {
    if (!conToken) { aviso("⚠ Pega tu token en Ajustes para poder subir imágenes."); return; }
    setSubiendo(true);
    try {
      const base64 = await archivoABase64Jpeg(file, 1600, 0.87);
      const nombre = (p.titulo || "programa").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").toLowerCase().slice(0, 40);
      const url = await subirImagen(cfg, nombre + ".jpg", base64);
      set("imagen", url);
      aviso("✓ Imagen subida a GitHub.");
    } catch (e) { aviso("⚠ " + e.message); }
    setSubiendo(false);
  }

  const errorHorario = aMinutos(p.fin) <= aMinutos(p.inicio) && duracionMin(p) < 1440 ? "La hora final debe ser mayor a la inicial." : "";
  const ultimas = horasDeRepeticion(p, 12);
  const repSinCierre = p.repetirCada && ultimas.length === 0
    ? `Con «repetir cada ${p.repetirCada} h» la emisión no cabe en el día: acorta la duración o aumenta la repetición.` : "";

  return (
    <Dialogo titulo={inicial.titulo ? "Editar programa" : "Nuevo programa"} onClose={onCerrar} ancho="max-w-xl">
      <div className="grid gap-3">
        <Campo label="Título del programa">
          <input className={inpCls} value={p.titulo} onChange={(e) => set("titulo", e.target.value)} placeholder="Ej: Alborada Colombiana" />
        </Campo>
        <Campo label="Conductor(a)">
          <input className={inpCls} value={p.conductor} onChange={(e) => set("conductor", e.target.value)} placeholder="Nombre del presentador" />
        </Campo>
        <div className="grid grid-cols-2 gap-3">
          <Campo label="Hora de inicio"><input type="time" className={inpCls} value={p.inicio} onChange={(e) => set("inicio", e.target.value)} /></Campo>
          <Campo label="Hora de fin"><input type="time" className={inpCls} value={p.fin} onChange={(e) => set("fin", e.target.value)} /></Campo>
        </div>
        {errorHorario && <p className="rounded-lg bg-red-500/10 px-3 py-2 text-xs text-red-700 dark:text-red-300">{errorHorario}</p>}
        <Campo label="Repetición el mismo día" hint="Deja en «No repetir» para emisiones únicas.">

/* ══════════════ PESTAÑA IMÁGENES ══════════════ */
function TabImagenes({ cfg, conToken, aviso, alSubir }) {
  const [imagenes, setImagenes] = useState(null);
  const [cargando, setCargando] = useState(false);
  const [subiendo, setSubiendo] = useState(false);
  const fileRef = useRef(null);

  const recargar = () => {
    if (!conToken) { setImagenes([]); return; }
    setCargando(true);
    listarImagenes(cfg).then(setImagenes).catch((e) => aviso("⚠ " + e.message)).finally(() => setCargando(false));
  };
  useEffect(recargar, []);

  async function subir(files) {
    setSubiendo(true);
    try {
      for (const f of Array.from(files)) {
        const base64 = await archivoABase64Jpeg(f, 1600, 0.87);
        const base = f.name.replace(/\.[^.]+$/, "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9._-]+/g, "-").toLowerCase() || "imagen";
        await subirImagen(cfg, base + ".jpg", base64);
      }
      aviso("✓ Imagen(es) subidas a GitHub.");
      alSubir(); recargar();
    } catch (e) { aviso("⚠ " + e.message); }
    setSubiendo(false);
  }
  async function eliminar(im) {
    if (!window.confirm(`¿Eliminar ${im.name} de GitHub?`)) return;
    try { await borrarImagen(cfg, im.name, im.sha); aviso("Imagen eliminada."); recargar(); }
    catch (e) { aviso("⚠ " + e.message); }
  }

  return (
    <div className="space-y-3">
      <div className="flex flex-wrap items-center gap-2">
        <input ref={fileRef} type="file" accept="image/*" multiple className="hidden"
          onChange={(e) => { if (e.target.files.length) subir(e.target.files); e.target.value = ""; }} />
        <Boton principal disabled={!conToken || subiendo} onClick={() => fileRef.current && fileRef.current.click()}>
          {subiendo ? <span className="spin">◌</span> : "⬆"} {subiendo ? "Subiendo…" : "Subir imágenes"}
        </Boton>
        <Boton disabled={cargando} onClick={recargar}>↻ Recargar</Boton>
        {!conToken && <span className="text-xs text-amber-600 dark:text-amber-400">Pega tu token en Ajustes para gestionar imágenes.</span>}
      </div>

      <Tarjeta className="p-3 text-xs text-zinc-600 dark:text-zinc-400">
        <b className="text-sm text-zinc-900 dark:text-zinc-100">📏 Guía de dimensiones</b>
        <p className="mt-1">Recomendado <b>1600×900 px (16:9)</b> · mínimo 800 px de ancho · JPG o PNG · menos de 300 KB.
        Al subir desde el panel, la imagen se reduce y comprime automáticamente.</p>
      </Tarjeta>

      {imagenes === null || cargando ? (
        <p className="py-8 text-center text-sm text-zinc-500">Cargando imágenes…</p>
      ) : (
        <div className="grid grid-cols-2 gap-3 sm:grid-cols-3">
          {imagenes.map((im) => (
            <Tarjeta key={im.sha} className="overflow-hidden">
              <img src={im.url} alt={im.name} className="aspect-video w-full object-cover" loading="lazy"
                onError={(e) => { e.target.style.background = "#333"; }} />
              <div className="p-2">
                <p className="truncate text-[11px] font-semibold" title={im.name}>{im.name}</p>
                <p className="text-[10px] text-zinc-500">{Math.round(im.size / 1024)} KB</p>
                <div className="mt-1 flex gap-1">
                  <Boton fantasma className="!px-2 !py-0.5 text-[11px]" onClick={async () => { if (await copiarTexto(im.url)) aviso("URL copiada"); }}>📋 URL</Boton>
                  <Boton peligro className="!px-2 !py-0.5 text-[11px]" onClick={() => eliminar(im)}>🗑</Boton>
                </div>
              </div>
            </Tarjeta>
          ))}
          {!imagenes.length && <p className="col-span-full py-6 text-center text-sm text-zinc-500">No hay imágenes en la carpeta imagenes/.</p>}
        </div>
      )}
    </div>
  );
}

          <div className="rounded-xl border border-zinc-200 bg-zinc-200/60 p-3 dark:border-zinc-800 dark:bg-zinc-800/60">
            <iframe key={version} src={wUrl + "?v=" + version} title="Vista previa" className="h-[210px] w-full rounded-lg" />
          </div>

        <Tarjeta>
          <div className="px-4 pt-4">
            <h3 className="text-sm font-bold">🔗 Acceder al widget</h3>
          </div>
          <div className="grid gap-2 p-4">

              <span className="min-w-0 flex-1 truncate font-mono text-[10px] text-zinc-500 dark:text-zinc-400">{wUrl}</span>
              <Boton fantasma className="!h-7 !w-7 !p-0" title="Copiar enlace" onClick={async () => { if (await copiarTexto(wUrl)) { setCopiadoEnlace(true); setTimeout(() => setCopiadoEnlace(false), 2000); } }}>
                {copiadoEnlace ? "✓" : "⧉"}
              </Boton>
            </div>
          </div>
        </Tarjeta>

        <Tarjeta>
          <div className="px-4 pt-4">
            <h3 className="text-sm font-bold">💻 Código para tu web</h3>
            <p className="text-xs text-zinc-500 dark:text-zinc-400">Iframe listo para pegar, o el HTML completo.</p>
          </div>
          <div className="grid gap-2 p-4">
            <div className="relative">
              <pre className="overflow-x-auto rounded-lg bg-zinc-900 p-2 pr-8 text-[10px] leading-relaxed text-zinc-100">{codigoIframe}</pre>
              <button className="absolute right-1 top-1 rounded px-1.5 py-0.5 text-xs text-zinc-300 hover:bg-zinc-800"
                title="Copiar iframe" onClick={async () => { if (await copiarTexto(codigoIframe)) { setCopiadoIframe(true); aviso("Código iframe copiado"); setTimeout(() => setCopiadoIframe(false), 2000); } }}>
                {copiadoIframe ? "✓" : "⧉"}

            <div className="grid grid-cols-2 gap-2">
              <Boton onClick={abrirCodigo}>👁 Ver código</Boton>

            </Boton>

function TabAjustes({ cfg, conToken, onGuardado, aviso }) {

  const [probando, setProbando] = useState(false);
  const [resultado, setResultado] = useState("");
  const set = (k, v) => setD((x) => Object.assign({}, x, { [k]: v }));

  async function probar() {
    setProbando(true); setResultado("");
    try {
      TOKEN = d.token.trim();
      const r = await api(d, `/repos/${d.owner}/${d.repo}`);
      if (!r.ok) throw new Error(mensajeError(r.status, await r.json().catch(() => ({}))));
      const repo = await r.json();
      setResultado(`✓ Conexión OK con ${repo.full_name} (rama ${d.branch}).`);
    } catch (e) { setResultado("⚠ " + e.message); }
    setProbando(false);
  }
  function guardar() {
    d.token = d.token.trim();

    localStorage.setItem(K_CFG, JSON.stringify(Object.assign({}, d, { token: undefined })));

  return (
    <div className="mx-auto max-w-xl space-y-3">

        <h3 className="text-sm font-bold">🔑 Token de GitHub</h3>
        <p className="mt-1 text-xs text-zinc-500 dark:text-zinc-400">

/* ══════════════ APP ══════════════ */
function App() {
  const [cfg, setCfg] = useState(cargarCfg);
  const [conToken, setConToken] = useState(Boolean(localStorage.getItem(K_TOKEN)));
  const [data, setData] = useState(null);
  const [sha, setSha] = useState(null);
  const [soloLectura, setSoloLectura] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [cargando, setCargando] = useState(true);
  const [guardando, setGuardando] = useState(false);
  const [tab, setTab] = useState("prog");
  const [editando, setEditando] = useState(null);
  const [confirmar, setConfirmar] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [ahora, setAhora] = useState(new Date());
  const [tema, setTema] = useState(() => localStorage.getItem(K_THEME) || "dark");

  useEffect(() => {
    document.documentElement.classList.toggle("dark", tema === "dark");
    localStorage.setItem(K_THEME, tema);
  }, [tema]);
  useEffect(() => { const t = setInterval(() => setAhora(new Date()), 30000); return () => clearInterval(t); }, []);
  useEffect(() => {
    const h = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } };
    window.addEventListener("beforeunload", h);
    return () => window.removeEventListener("beforeunload", h);
  }, [dirty]);

  const aviso = (msg) => {
    const id = Date.now() + Math.random();
    setToasts((ts) => [...ts, { id, msg }]);
    setTimeout(() => setToasts((ts) => ts.filter((t) => t.id !== id)), 5500);
  };

  const recargar = () => {
    setCargando(true);
    TOKEN = localStorage.getItem(K_TOKEN) || "";
    return leerProgramacion(cfg)
      .then((r) => {
        setData(r.data || { version: 1, emisora: null, programas: [] });
        setSha(r.sha); setSoloLectura(Boolean(r.soloLectura)); setDirty(false);
      })
      .catch((e) => { aviso("⚠ " + e.message); setSoloLectura(true); })
      .finally(() => setCargando(false));
  };
  useEffect(() => { recargar(); }, []);
  useEffect(() => { TOKEN = localStorage.getItem(K_TOKEN) || ""; }, [conToken]);

  const emisora = (data && data.emisora) || { nombre: "Voces Campesinas", streamUrl: "", imagenPorDefecto: "" };
  const programas = (data && data.programas) || [];
  const alAire = encontrarAlAire(programas, ahora);

  const setProgramas = (fn) => { setData((d) => Object.assign({}, d, { programas: fn(d.programas) })); setDirty(true); };
  const setEmisora = (k, v) => { setData((d) => Object.assign({}, d, { emisora: Object.assign({}, d.emisora, { [k]: v }) })); setDirty(true); };

  function guardarPrograma(p) {
    setProgramas((ps) => ps.some((x) => x.id === p.id) ? ps.map((x) => (x.id === p.id ? p : x)) : [...ps, p]);
    setEditando(null);
    aviso("Programa listo. Pulsa «Guardar en GitHub» para publicarlo.");
  }
  const acciones = {
    editar: (p) => setEditando(p),
    duplicar: (p) => {
      const copia = sanitizarPrograma(Object.assign({}, p, { id: "prog-" + Date.now().toString(36), titulo: p.titulo + " (copia)" }));
      setProgramas((ps) => [...ps, copia]);
      aviso("Programa duplicado. Ajusta horarios y guarda.");
    },
    borrar: (p) => setConfirmar({
      texto: `¿Eliminar «${p.titulo || p.id}»? Se publicará al guardar.`,
      onOk: () => { setProgramas((ps) => ps.filter((x) => x.id !== p.id)); setConfirmar(null); },
    }),
  };

  async function guardar() {
    if (soloLectura) { aviso("⚠ Sin token no se puede publicar. Pégalo en Ajustes."); return; }
    const limpios = programas.map(sanitizarPrograma).filter((p) => p.id);
    for (const p of limpios) {
      if (!p.titulo || !p.inicio || !p.fin || !p.dias.length) {
        aviso("⚠ «" + (p.titulo || "sin título") + "» está incompleto: título, horarios y al menos un día."); return;
      }
    }
    setGuardando(true);
    try {
      const file = {
        version: 1,
        actualizado: new Date().toISOString(),
        emisora: {
          nombre: (emisora.nombre || "").trim() || "Voces Campesinas",
          streamUrl: (emisora.streamUrl || "").trim(),
          imagenPorDefecto: (emisora.imagenPorDefecto || "").trim(),
        },
        programas: limpios,
      };
      const sha2 = await guardarProgramacion(cfg, file, sha);
      setSha(sha2); setDirty(false);
      aviso("✓ ¡Publicado en GitHub! El widget se actualiza solo en ~2 minutos.");
    } catch (e) { aviso("⚠ " + e.message); }
    setGuardando(false);
  }

  const pestanas = [
    ["prog", "📅", "Programación"],
    ["img", "🖼", "Imágenes"],
    ["widget", "💻", "Widget"],
    ["ajustes", "⚙️", "Ajustes"],
  ];

  return (
    <div className="flex min-h-screen flex-col">
      {/* Encabezado */}
      <header className="bg-[#17202A] text-white">
        <div className="mx-auto flex max-w-5xl flex-wrap items-center gap-3 px-4 py-4">
          <div className="flex h-10 w-10 items-center justify-center rounded-lg bg-[#F4D03F] text-black">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <rect x="2" y="7" width="20" height="13" rx="2" /><path d="M7 3l5 4 5-4" /><circle cx="12" cy="13.5" r="2.5" /><path d="M6.5 17h.01M17.5 17h.01" />
            </svg>
          </div>
          <div className="min-w-0 flex-1">
            <h1 className="truncate text-lg font-black leading-tight">Voces Campesinas · Panel de programación</h1>
            <p className="text-xs text-white/60">
              {alAire
                ? <>Ahora al aire: <b className="text-emerald-300">{alAire.titulo}</b>{alAire.esReemision ? " (reemisión)" : ""}</>
                : data ? "Sin programas al aire en este momento" : "Administra horarios e imágenes; todo queda guardado en GitHub."}
            </p>
          </div>
          <span className="rounded-full border border-white/20 bg-white/10 px-2.5 py-0.5 text-xs">{cfg.owner}/{cfg.repo}</span>
          <span className={"rounded-full border border-transparent px-2.5 py-0.5 text-xs font-semibold " + (conToken ? "bg-green-500/20 text-green-300" : "bg-amber-500/20 text-amber-300")}>
            {conToken ? "GitHub conectado" : "Sin token"}
          </span>
          <button className="rounded-lg px-2 py-1 text-white/70 hover:bg-white/10" title="Tema claro / oscuro" onClick={() => setTema(tema === "dark" ? "light" : "dark")}>
            {tema === "dark" ? "☀️" : "🌙"}
          </button>
        </div>
      </header>

      <main className="mx-auto w-full max-w-5xl flex-1 px-4 py-5">
        {/* Pestañas */}
        <div className="mb-4 flex flex-wrap gap-1 rounded-xl border border-zinc-200 bg-white p-1 dark:border-zinc-800 dark:bg-zinc-900">
          {pestanas.map(([k, ico, t]) => (
            <button key={k} onClick={() => setTab(k)}
              className={"flex flex-1 items-center justify-center gap-1.5 rounded-lg px-3 py-2 text-sm font-semibold transition " + (tab === k
                ? "bg-zinc-200 text-zinc-900 dark:bg-zinc-800 dark:text-white"
                : "text-zinc-500 hover:bg-black/5 dark:text-zinc-400 dark:hover:bg-white/5")}>
              <span>{ico}</span> {t}
            </button>
          ))}
        </div>

        {/* Barra de publicación */}
        {tab !== "ajustes" && (
          <div className="mb-3 flex flex-wrap items-center gap-2 rounded-xl border border-zinc-200 bg-white px-3 py-2 dark:border-zinc-800 dark:bg-zinc-900">
            {soloLectura
              ? <span className="rounded-full bg-amber-500/15 px-2.5 py-0.5 text-xs font-semibold text-amber-700 dark:text-amber-300">👁 Modo solo lectura</span>
              : <span className={"text-xs font-bold " + (dirty ? "text-amber-600 dark:text-amber-300" : "text-emerald-600 dark:text-emerald-300")}>
                  {dirty ? "● Sin guardar" : "● Sincronizado"}
                </span>}
            <div className="flex-1" />
            <Boton className="!py-1.5 text-xs" disabled={cargando} onClick={() => recargar().then(() => aviso("Recargado desde GitHub."))}>↻ Recargar</Boton>
            {dirty && <Boton className="!py-1.5 text-xs" disabled={guardando} onClick={() => recargar().then(() => aviso("Cambios descartados."))}>↩ Descartar</Boton>}
            <Boton principal className="!py-1.5 text-xs" disabled={guardando || !dirty || soloLectura} onClick={guardar}>
              {guardando ? "Publicando…" : "⬆ Guardar en GitHub"}
            </Boton>
          </div>
        )}

        {cargando && !data ? (
          <p className="py-10 text-center text-sm text-zinc-500"><span className="spin inline-block">◌</span> Cargando programación desde GitHub…</p>
        ) : tab === "prog" ? (
          <TabProgramacion emisora={emisora} setEmisora={setEmisora} programas={programas} alAire={alAire}
            conToken={conToken} onNuevo={() => setEditando({})} acciones={acciones} />
        ) : tab === "img" ? (
          <TabImagenes cfg={cfg} conToken={conToken} aviso={aviso} alSubir={recargar} />
        ) : tab === "widget" ? (
          <TabWidget cfg={cfg} aviso={aviso} />
        ) : (
          <TabAjustes cfg={cfg} conToken={conToken} aviso={aviso}
            onGuardado={(d) => { setCfg(d); setConToken(Boolean(d.token)); recargar(); }} />
        )}
      </main>

      <footer className="mt-auto border-t border-zinc-200 bg-white py-3 dark:border-zinc-800 dark:bg-zinc-900">
        <p className="mx-auto max-w-5xl px-4 text-center text-xs text-zinc-500 dark:text-zinc-400">
          Voces Campesinas · La programación y las imágenes viven en tu repo de GitHub.
          Panel: <span className="font-mono">{urlPagina(cfg)}</span>
        </p>
      </footer>

      {/* Diálogos y toasts */}
      {editando && (
        <EditorPrograma inicial={editando} cfg={cfg} conToken={conToken} aviso={aviso}
          onGuardar={guardarPrograma} onCerrar={() => setEditando(null)} />
      )}
      {confirmar && (
        <Dialogo titulo="Confirmar" onClose={() => setConfirmar(null)}>
          <p className="text-sm">{confirmar.texto}</p>
          <div className="mt-4 flex justify-end gap-2">
            <Boton onClick={() => setConfirmar(null)}>Cancelar</Boton>
            <Boton peligro onClick={confirmar.onOk}>🗑 Eliminar</Boton>
          </div>
        </Dialogo>
      )}
      <div className="fixed bottom-4 right-4 z-[60] flex max-w-sm flex-col gap-2">
        {toasts.map((t) => (
          <div key={t.id} className="rounded-lg border border-zinc-700 bg-[#17202A] px-4 py-2.5 text-sm text-white shadow-xl">{t.msg}</div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
